spring:
  application:
    name: oops-backend
  # API 키는 application-secret.yml 에 넣는다. 이 파일은 .gitignore 에 있어서 깃에 안 올라간다.
  # optional: 이라서 파일이 없어도 서버는 그냥 뜬다 (LLM 분석기만 스킵된다).
  # 환경변수 OPENAI_API_KEY 를 쓰던 방식도 그대로 동작한다.
  config:
    import: optional:classpath:application-secret.yml
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null
  jpa:
    # 컨트롤러/뷰 렌더링 중에 DB 커넥션을 붙잡고 있지 않게 한다.
    # 분석이 오래 걸리는 서비스라 커넥션을 빨리 반납하는 편이 안전하다.
    open-in-view: false

server:
  port: 8080

# API 문서
#   Swagger UI : http://localhost:8080/swagger-ui.html
#   OpenAPI    : http://localhost:8080/api-docs
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # 테스트용 정적 페이지는 문서에 노출하지 않는다
  paths-to-match: /api/**

oops:
  # 프론트가 다른 도메인에서 호출한다. 명세 §11.
  # 배포 도메인이 정해지면 여기만 고치면 된다. REST 와 WebSocket 이 같은 목록을 쓴다.
  cors:
    allowed-origins:
      - http://localhost:5173 # Vite dev server
      - http://localhost:3000
      - http://localhost:8080 # 백엔드 자체 테스트 페이지
      - https://oops-im-so-sorry.vercel.app # 배포된 프론트 (Vercel)
      - https://oops-im-sorry.online # 커스텀 도메인

      # Vercel 은 브랜치·PR 마다 미리보기 주소를 새로 만든다.
      # 그때마다 여기 추가하고 서버를 다시 띄우는 건 현실적이지 않아서
      # 패턴으로 받는다. allowedOriginPatterns 라서 * 를 쓸 수 있다.
      - https://oops-im-so-sorry-*.vercel.app

  storage:
    location: ./uploads # 업로드 파일 저장 위치

    # 정리는 두 단계다. 지워야 하는 것과 남겨야 하는 것이 다르기 때문이다.

    # [1] 원본 영상 파일만 지운다. 매시 정각에 확인한다.
    #
    # 분석이 끝나고 이 시간이 지나면 videos/{id}/original.* 를 지운다.
    # 리포트·대본·검토 후보·참고 자료·검수 이력·프레임 캡처는 전부 남는다.
    # 사용자는 어제 받은 검수 결과를 계속 볼 수 있고,
    # 우리는 출연자 얼굴과 목소리가 담긴 파일을 오래 들고 있지 않는다.
    #
    # 매시간 도는 이유: 하루 한 번만 돌면 24시간을 못 지킨다.
    # 새벽 4시 실행인데 분석이 4시 1분에 끝나면 다음 실행 때 23시간 59분이라
    # 아직 안 지워지고, 그다음까지 기다리면 거의 48시간이 된다.
    #
    # 0 이면 원본을 지우지 않는다. 개발 중에 영상이 사라지면 곤란할 때 쓴다.
    source-retention-hours: 24

    # [2] 영상에 딸린 모든 것을 지운다. 매일 새벽 4시. 리포트도 사라진다.
    #
    # 0 이면 정리하지 않는다. 기본은 꺼 둔다.
    # 검수 결과를 며칠 만에 없애는 건 보통 원하는 동작이 아니고,
    # 용량 문제는 위의 원본 정리로 대부분 해결된다.
    retention-days: 0

  # 분석 서버(oops-analysis) 없이 파이프라인만 돌려볼 때 true
  use-dummy-transcript: false

  analysis-server:
    base-url: ${ANALYSIS_SERVER_URL:http://localhost:8000}
    timeout: 10m # STT/OCR 은 오래 걸린다
    # 몇 초 간격으로 프레임을 뽑아 OCR 할지.
    # 이 값이 분석 시간을 가장 크게 좌우한다.
    # 2초로 두면 2분 영상에 60장을 인식해야 해서 2분 넘게 걸린다.
    # 자막은 보통 몇 초씩 유지되므로 4초 간격으로도 대부분 잡힌다.
    ocr-interval-sec: 4.0

  openai:
    api-key: ${OPENAI_API_KEY:} # 비어 있으면 LLM 분석기는 자동으로 스킵된다
    # 지원 크레딧이 특정 조직에 지급된 경우에만 채운다 (org-...).
    # 비워두면 계정 기본 조직으로 과금되어 크레딧이 안 쓰일 수 있다.
    organization: ${OPENAI_ORG_ID:}
    project: ${OPENAI_PROJECT_ID:}
    model: gpt-4o-mini
    timeout: 90s

    # 분당 보낼 요청 수. **계정 한도(RPM)보다 낮게** 잡는다.
    #
    # 결제 이력이 없는 신규 계정(Tier 1)의 gpt-4o-mini 한도가 분당 10건이다.
    # 이 값을 넘겨 보내면 429 가 나고, OpenAI 는 벌칙으로 수십 분 뒤에
    # 다시 오라고 답한다. 그러면 그 영상 분석은 결과가 통째로 빈다.
    #
    # 실제로 겪은 일이다. 예전에는 250ms 고정 간격이라 분당 240건 속도였고,
    # 계정 한도는 10건이었다. 첫 몇 초 만에 벽에 부딪히고
    # "28분 뒤에 오세요" 를 받아서 분석기 여러 개가 통째로 못 돌았다.
    #
    # 첫 응답 헤더(x-ratelimit-limit-requests)로 실제 한도가 확인되면
    # 이 값은 자동으로 맞춰진다. 여기 적는 건 그 전까지 쓸 초기값이다.
    # 낮게 잡아 손해 보는 건 시간뿐이다. 느린 것과 실패하는 것은 다르다.
    #
    # 한도 확인: https://platform.openai.com/settings/organization/limits
    requests-per-minute: 10

    # 토큰 단가. 분석이 끝나면 로그에 [openai-cost] 로 원가가 찍힌다.
    #
    # 코드에 박지 않고 여기 둔 이유는, OpenAI 가 가격을 바꾸면
    # 로그 숫자가 조용히 틀리기 시작하는데 틀린 줄도 모르게 되기 때문이다.
    # 모델을 바꿀 때도 여기만 고치면 된다.
    #
    # 최신 단가: https://openai.com/api/pricing
    pricing:
      input-per-1m: 0.15 # 1M 입력 토큰당 USD (gpt-4o-mini)
      cached-input-per-1m: 0.075 # 같은 프롬프트 반복 시 캐시된 입력은 절반
      output-per-1m: 0.60
      stt-per-minute: 0.006 # 음성 인식(whisper-1) 분당 USD
      usd-to-krw: 1400 # 원화 환산용. 대략치다

  # 뉴스 검색 소스는 자동 선택된다.
  #   키가 있으면  -> 네이버 뉴스 (국내 매체 커버리지가 넓다)
  #   키가 없으면  -> 구글 뉴스 RSS (키 불필요, 기본값)
  # 즉 아래를 비워둬도 시의성 분석은 동작한다.
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

  analysis:
    # 실행할 분석기와 순서. 여기 없는 분석기는 빈으로 떠 있어도 실행되지 않는다.
    # 타깃은 편집을 위임하는 토크·인터뷰·팟캐스트 채널이다.
    # 제작자가 이미 아는 장면을 다시 알려주는 것은 가치가 없다.
    # 그들이 놓치기 쉬운 곳만 본다.
    enabled-analyzers:
      - subtitle # 대본 금지어·개인정보 (LLM 불필요, 안전망)
      - speech-review # 발언 중 확인할 지점 (낯선 맥락, 대상 평가)
      - context-lexicon # 낯선 맥락 표현 사전 + 앞뒤 확인  ← P0 핵심
      - entity-check # 이름·날짜·수치 확인 (발언 + 화면 글자)  ← P0 핵심
      - context-check # 언급된 주제의 최근 배경    ← P0 핵심


      # 아래는 방향이 달라 기본에서 뺐다. 필요하면 한 줄 주석만 풀면 된다.
      #
      # screen-text        : 화면 자막 금지어 (룰 기반)
      # screen-text-review : 화면 자막 중 확인할 지점 (LLM)
      #
      #   OCR 자체를 끈 것이 아니다. 화면 글자 추출은 그대로 돌고 있고,
      #   entity-check 가 그 결과로 사실 확인을 한다.
      #
      #   뺀 이유는 이 둘이 화면 글자로 **표현 검토 후보**를 만들기 때문이다.
      #   그 후보는 candidateType 이 SPEECH_REVIEW 로 붙는데,
      #   화면에 박힌 글자를 "발언" 칸에 올리면 사용자는
      #   출연자가 그 말을 했다고 읽는다. 실제로는 편집자가 쓴 자막이다.
      #
      #   화면 글자에서 우리가 잡아야 하는 건
      #   "복사한 자막의 연도가 안 고쳐진 것" 이고, 그건 사실 확인 문제다.
      #   화면 자막의 표현 검토를 다시 켜려면 그 전에
      #   프론트에서 type=CAPTION 을 "화면 글자" 로 따로 그려야 한다.
      #
      # caption-mismatch : 발언과 자막 비교.
      #   OCR 이 편집 자막과 화면에 우연히 있는 글자(간판, 메뉴판, 채널 로고)를
      #   구분하지 못한다. 그래서 "발언은 A 인데 자막은 'POGUES' 다" 같은
      #   의미 없는 결과가 대부분이었다.
      #   자막이 발언과 다른 것 자체는 알릴 가치가 없고,
      #   자막이나 발언의 내용에 확인할 것이 있을 때만 알린다.
      #   화면 텍스트에서 편집 자막만 골라낼 수 있게 되면 다시 켠다.
      #
      # monetization : 노란딱지 예측. 광고 정책 문제라 지금 풀려는
      #                편집·정확성 문제와 성격이 다르다. 나중에 별도 기능으로.
      # comment      : 미구현. 공개 전에는 그 영상 댓글이 없다.
      # pose         : 미구현. 장면 분석은 범위에서 뺐다.
      #
      # - caption-mismatch
      # - monetization
      # - comment
      # - pose
