spring:
  application:
    name: oops-backend
  # API 키는 application-secret.yml 에 넣는다. 이 파일은 .gitignore 에 있어서 깃에 안 올라간다.
  # optional: 이라서 파일이 없어도 서버는 그냥 뜬다 (LLM 분석기만 스킵된다).
  # 환경변수 OPENAI_API_KEY 를 쓰던 방식도 그대로 동작한다.
  config:
    import: optional:classpath:application-secret.yml
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null
  jpa:
    # 컨트롤러/뷰 렌더링 중에 DB 커넥션을 붙잡고 있지 않게 한다.
    # 분석이 오래 걸리는 서비스라 커넥션을 빨리 반납하는 편이 안전하다.
    open-in-view: false

server:
  port: 8080

# API 문서
#   Swagger UI : http://localhost:8080/swagger-ui.html
#   OpenAPI    : http://localhost:8080/api-docs
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # 테스트용 정적 페이지는 문서에 노출하지 않는다
  paths-to-match: /api/**

oops:
  # 프론트가 다른 도메인에서 호출한다. 명세 §11.
  # 배포 도메인이 정해지면 여기만 고치면 된다. REST 와 WebSocket 이 같은 목록을 쓴다.
  cors:
    allowed-origins:
      - http://localhost:5173 # Vite dev server
      - http://localhost:3000
      - http://localhost:8080 # 백엔드 자체 테스트 페이지
      - https://oops-im-so-sorry.vercel.app # 배포된 프론트 (Vercel)
      - https://oops-im-sorry.online # 커스텀 도메인

      # Vercel 은 브랜치·PR 마다 미리보기 주소를 새로 만든다.
      # 그때마다 여기 추가하고 서버를 다시 띄우는 건 현실적이지 않아서
      # 패턴으로 받는다. allowedOriginPatterns 라서 * 를 쓸 수 있다.
      - https://oops-im-so-sorry-*.vercel.app

  storage:
    location: ./uploads # 업로드 파일 저장 위치

    # 정리는 두 단계다. 지워야 하는 것과 남겨야 하는 것이 다르기 때문이다.

    # [1] 원본 영상 파일만 지운다. 매시 정각에 확인한다.
    #
    # 분석이 끝나고 이 시간이 지나면 videos/{id}/original.* 를 지운다.
    # 리포트·대본·검토 후보·참고 자료·검수 이력·프레임 캡처는 전부 남는다.
    # 사용자는 어제 받은 검수 결과를 계속 볼 수 있고,
    # 우리는 출연자 얼굴과 목소리가 담긴 파일을 오래 들고 있지 않는다.
    #
    # 매시간 도는 이유: 하루 한 번만 돌면 24시간을 못 지킨다.
    # 새벽 4시 실행인데 분석이 4시 1분에 끝나면 다음 실행 때 23시간 59분이라
    # 아직 안 지워지고, 그다음까지 기다리면 거의 48시간이 된다.
    #
    # 0 이면 원본을 지우지 않는다. 개발 중에 영상이 사라지면 곤란할 때 쓴다.
    source-retention-hours: 24

    # [2] 영상에 딸린 모든 것을 지운다. 매일 새벽 4시. 리포트도 사라진다.
    #
    # 0 이면 정리하지 않는다. 기본은 꺼 둔다.
    # 검수 결과를 며칠 만에 없애는 건 보통 원하는 동작이 아니고,
    # 용량 문제는 위의 원본 정리로 대부분 해결된다.
    retention-days: 0

  # 분석 서버(oops-analysis) 없이 파이프라인만 돌려볼 때 true
  use-dummy-transcript: false

  analysis-server:
    base-url: ${ANALYSIS_SERVER_URL:http://localhost:8000}
    timeout: 10m # STT/OCR 은 오래 걸린다
    # 몇 초 간격으로 프레임을 뽑아 OCR 할지.
    # 이 값이 분석 시간을 가장 크게 좌우한다.
    # 2초로 두면 2분 영상에 60장을 인식해야 해서 2분 넘게 걸린다.
    # 자막은 보통 몇 초씩 유지되므로 4초 간격으로도 대부분 잡힌다.
    ocr-interval-sec: 4.0

  openai:
    api-key: ${OPENAI_API_KEY:} # 비어 있으면 LLM 분석기는 자동으로 스킵된다
    # 지원 크레딧이 특정 조직에 지급된 경우에만 채운다 (org-...).
    # 비워두면 계정 기본 조직으로 과금되어 크레딧이 안 쓰일 수 있다.
    organization: ${OPENAI_ORG_ID:}
    project: ${OPENAI_PROJECT_ID:}
    # 2026-10 고도화: gpt-4o-mini → gpt-6-luna
    model: gpt-6-luna
    # 추론 강도. none 이면 속으로 생각하는 토큰이 없어 가장 싸다.
    # 정확도가 부족하면 low 로 올려 보고, 비용은 [openai-cost] 로그로 비교한다.
    # (추론 토큰은 출력 토큰으로 과금된다)
    reasoning-effort: none
    # temperature 는 비워 둔다. 비우면 gpt-4 계열에만 0.1 을 보낸다.
    # 모델이 받지 않는 옵션이면 코드가 한 번 빼고 다시 보낸다.
    # temperature: 0.1
    timeout: 90s

    # 시작할 때 쓸 분당 요청 수. **계정 한도보다 낮게** 잡는다.
    #
    # 계정마다 한도가 크게 다르다 (gpt-4o-mini 기준).
    #   무료      분당 3건    · 하루 200건
    #   Tier 1    분당 500건  · 하루 10,000건   ($5 이상 구매 시)
    #
    # 실제로 겪은 일이다. 예전에는 250ms 고정 간격이라 분당 240건 속도였는데
    # 계정은 무료였다. 첫 몇 초 만에 벽에 부딪히고 "28분 뒤에 오세요" 를 받아
    # 분석기 여러 개가 통째로 못 돌았다.
    #
    # 여기를 500 으로 올리지 마라. 무료 계정에서 즉시 막힌다.
    # 첫 응답 헤더(x-ratelimit-limit-requests)로 실제 한도가 확인되면
    # 코드가 알아서 올린다. 10 으로 시작해 손해 보는 건 첫 호출까지 몇 초뿐이다.
    #
    # 한도 확인: https://platform.openai.com/settings/organization/limits
    requests-per-minute: 10

    # 하루 요청 한도. **속도 제어에는 안 쓴다.**
    # 하루 한도는 응답 헤더로 오지 않아서 우리가 알 방법이 없다.
    # "이 계정으로 60분짜리 몇 편을 돌릴 수 있는지" 를 로그에 찍는 용도다.
    #
    #   무료 200 · Tier 1 10,000
    requests-per-day: 10000

    # 토큰 단가. 분석이 끝나면 로그에 [openai-cost] 로 원가가 찍힌다.
    #
    # 코드에 박지 않고 여기 둔 이유는, OpenAI 가 가격을 바꾸면
    # 로그 숫자가 조용히 틀리기 시작하는데 틀린 줄도 모르게 되기 때문이다.
    # 모델을 바꿀 때도 여기만 고치면 된다.
    #
    # 최신 단가: https://openai.com/api/pricing
    pricing:
      input-per-1m: 0.10 # 1M 입력 토큰당 USD (gpt-6-luna. gpt-4o-mini 는 0.15)
      cached-input-per-1m: 0.01 # 같은 프롬프트 반복 시 캐시된 입력 (gpt-6-luna 는 90% 할인. gpt-4o-mini 는 0.075)
      output-per-1m: 0.50 # (gpt-4o-mini 는 0.60)
      stt-per-minute: 0.006 # 음성 인식(whisper-1) 분당 USD
      usd-to-krw: 1400 # 원화 환산용. 대략치다

  # 뉴스 검색 소스는 자동 선택된다.
  #   키가 있으면  -> 네이버 뉴스 (국내 매체 커버리지가 넓다)
  #   키가 없으면  -> 구글 뉴스 RSS (키 불필요, 기본값)
  # 즉 아래를 비워둬도 시의성 분석은 동작한다.
  # 웹 검색 (2026-10 고도화). 사실 확인과 최근 이슈 확인에 쓴다.
  #   perplexity 메인 · serper 보조. 둘 다 키가 없으면 아래 네이버 → 구글 뉴스 RSS 를 쓴다.
  #   키는 application-secret.yml 에 넣는다.
  search:
    perplexity:
      api-key: ${PERPLEXITY_API_KEY:}
      # 사실 확인용. web(넓게, 1,000건당 $5) / fast(얇게, $1)
      # 2026-10 서버 테스트: 28분 영상에서 검색비가 AI 분석비의 6~9배라 fast 로 바꿔 비교 중.
      # 근거가 부족해지면 web 으로 되돌린다.
      search-type: fast
      recent-search-type: fast # 최근 이슈 확인용. "지금 진행 중인가" 만 보면 돼서 fast 로 충분
      country: KR
      max-tokens-per-page: 256 # 페이지 하나에서 가져올 본문 양. 작을수록 싸고 빠르다
    serper:
      api-key: ${SERPER_API_KEY:}
      gl: kr
      hl: ko
    # 자료 하나당 AI 에게 넘길 최대 글자 수. 웹 페이지 본문이 길어서 자르지 않으면 대조 입력이 커진다
    max-snippet-chars: 400

  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

  analysis:
    # 실행할 분석기와 순서. 여기 없는 분석기는 빈으로 떠 있어도 실행되지 않는다.
    # 타깃은 편집을 위임하는 토크·인터뷰·팟캐스트 채널이다.
    # 제작자가 이미 아는 장면을 다시 알려주는 것은 가치가 없다.
    # 그들이 놓치기 쉬운 곳만 본다.
    # ── 2026-10 고도화 ───────────────────────────────────────────────
    # 기준 버전(git tag baseline-v1)과 비교하려고 바꾼 구성이다. 기준 버전 구성은 맨 아래 주석에 있다.
    #
    #   맥락 검토(context-review)  발언 검토·화면 자막 검토·사전 맥락 확인을 하나로 합쳤다.
    #                              8유형, 1차 선별 → 2차 유형별 검증. 프롬프트는 review/ReviewPrompts.java
    #   자막                       SRT 자막 파일로 받는다 (caption-source: srt). OCR 은 돌리지 않는다.
    #   발언·자막 비교              SRT 덕분에 다시 켰다. 받아 적은 자막은 비교하지 않는다.
    #   사실 확인                  자막까지 본다. 받아 적은 자막은 빼고, 편집자가 넣은 자막만 더 본다.
    enabled-analyzers:
      - subtitle # 발언 안전망: 욕설·개인정보·맥락 확인이 필요 없는 멸칭 (LLM 불필요)
      - screen-text # 자막 안전망: 위와 같음. 발언을 받아 적은 자막은 건너뛴다
      - context-review # 맥락 검토 8유형 (2단계)  ← 핵심
      - context-check # 언급된 인물·사건의 최근 이슈 (웹 검색)
      - entity-check # 이름·날짜·수치 확인 (웹 검색 + 대조)
      - caption-mismatch # 발언과 자막의 의미 차이

    # 사실 확인이 자막까지 볼지.
    # 예전에는 OCR 이 메뉴판·간판까지 읽어서 오탐이 나와 꺼 두었다.
    # SRT 는 편집 자막만 들어오므로 켠다. 편집자가 지난 자막을 복사해 숫자만 안 고친 경우를 잡는다.
    fact-check-screen-text: true

    # 자막을 어디서 가져올지.
    #   srt  업로드 때 함께 받은 SRT 자막 파일 (기본). 자막 파일이 없으면 발언만 분석한다.
    #   ocr  예전처럼 화면 캡처에서 글자를 읽는다 (분석 서버의 OCR 이 필요하다)
    caption-source: srt

    # 맥락 검토 설정
    context-review:
      # 1차 선별에 한 번에 넣는 줄 수. 크면 호출·토큰이 줄고, 작으면 꼼꼼히 본다.
      # 테스트 결과를 보고 20~40 사이에서 맞춘다.
      window-size: 30
      overlap: 3
      # 2차 검증에서 한 번에 판단할 후보 수
      verify-batch-size: 6
      # 1차 선별이 한 창에서 올릴 수 있는 최대 후보 수 (폭주 방지)
      max-candidates-per-window: 8

    # ── 기준 버전(baseline-v1) 구성 ──
    # 기준 버전으로 돌리려면 git checkout baseline-v1 을 쓴다. 참고로 그때 구성은 이랬다.
    #   enabled-analyzers: subtitle, speech-review, context-lexicon, context-check,
    #                      screen-text, screen-text-review, entity-check
    #   fact-check-screen-text: false, 자막은 OCR
    # 예전 분석기(speech-review, screen-text-review, context-lexicon)는 코드에 남아 있어서
    # 위 목록에 다시 넣으면 그대로 돈다. 다만 새 8유형이 아니라 예전 유형으로 결과를 낸다.
