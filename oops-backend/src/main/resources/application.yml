spring:
  application:
    name: oops-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null
  jpa:
    # 컨트롤러/뷰 렌더링 중에 DB 커넥션을 붙잡고 있지 않게 한다.
    # 분석이 오래 걸리는 서비스라 커넥션을 빨리 반납하는 편이 안전하다.
    open-in-view: false

server:
  port: 8080

# API 문서
#   Swagger UI : http://localhost:8080/swagger-ui.html
#   OpenAPI    : http://localhost:8080/api-docs
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # 테스트용 정적 페이지는 문서에 노출하지 않는다
  paths-to-match: /api/**

oops:
  storage:
    location: ./uploads              # 업로드 파일 저장 위치

    # 며칠 지난 영상을 자동으로 지울지. 매일 새벽 4시에 정리한다.
    # 0 이면 정리하지 않는다. 로컬 개발에서는 테스트 영상이 사라지면 곤란하므로 꺼 둔다.
    # 배포 서버에서는 7 정도로 켜는 것을 권한다. 안 그러면 디스크가 조용히 찬다.
    retention-days: 0

  # 분석 서버(oops-analysis) 없이 파이프라인만 돌려볼 때 true
  use-dummy-transcript: false

  analysis-server:
    base-url: ${ANALYSIS_SERVER_URL:http://localhost:8000}
    timeout: 10m                     # STT/OCR 은 오래 걸린다
    # 몇 초 간격으로 프레임을 뽑아 OCR 할지.
    # 이 값이 분석 시간을 가장 크게 좌우한다.
    # 2초로 두면 2분 영상에 60장을 인식해야 해서 2분 넘게 걸린다.
    # 자막은 보통 몇 초씩 유지되므로 4초 간격으로도 대부분 잡힌다.
    ocr-interval-sec: 4.0

  openai:
    api-key: ${OPENAI_API_KEY:}      # 비어 있으면 LLM 분석기는 자동으로 스킵된다
    # 지원 크레딧이 특정 조직에 지급된 경우에만 채운다 (org-...).
    # 비워두면 계정 기본 조직으로 과금되어 크레딧이 안 쓰일 수 있다.
    organization: ${OPENAI_ORG_ID:}
    project: ${OPENAI_PROJECT_ID:}
    model: gpt-4o-mini
    timeout: 90s

  # 뉴스 검색 소스는 자동 선택된다.
  #   키가 있으면  -> 네이버 뉴스 (국내 매체 커버리지가 넓다)
  #   키가 없으면  -> 구글 뉴스 RSS (키 불필요, 기본값)
  # 즉 아래를 비워둬도 시의성 분석은 동작한다.
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

  analysis:
    # 실행할 분석기와 순서. 여기 없는 분석기는 빈으로 떠 있어도 실행되지 않는다.
    enabled-analyzers:
      - subtitle          # 대본 키워드/정규식 (LLM 불필요)
      - speech-risk       # 발언 리스크 LLM 판정 (조롱/비하/일반화/민감주제)
      - screen-text       # 화면 자막 키워드 검사 (LLM 불필요)
      - screen-text-risk  # 화면 자막 LLM 판정 (민감 주제 등)
      - monetization      # 노란딱지 예측 (유튜브 광고주 친화 가이드라인)
      - fact-check        # 사실 검증 (경제·정책·투자 영상에서만 실행)
      - timeliness        # 시의성 검토 (뉴스 검색 + LLM). 키 없이도 동작

      # 발언과 화면 자막은 각각 독립적으로 분석한다.
      # 둘을 대조해 "자막이 발언을 왜곡했다" 고 잡던 caption-mismatch 는 껐다.
      # 예능 자막·요약 자막은 원래 발언과 다른 게 정상이고,
      # OCR 이 글자를 틀리게 읽으면 그것까지 왜곡으로 잡혀 오탐이 대부분이었다.
      # OCR 정확도가 올라가면 다시 켜볼 수 있다.
      # - caption-mismatch

      # - comment         # 미구현
      # - pose            # 미구현
