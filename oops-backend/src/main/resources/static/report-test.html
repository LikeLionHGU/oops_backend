<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>검수 리스트 확인</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
         max-width: 1000px; margin: 28px auto; padding: 0 20px; line-height: 1.6; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  input[type=number] { padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px;
                       font-size: 14px; width: 80px; }
  select { padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; font-size: 14px;
           cursor: pointer; background: #2563eb; color: #fff; }
  button.ghost { background: #6b7280; }
  button.mini { padding: 3px 10px; font-size: 12px; background: #e5e7eb; color: #374151; }
  button.mini.on { background: #2563eb; color: #fff; }
  video { width: 100%; max-height: 420px; background: #000; border-radius: 8px; }
  #ytWrap iframe { width: 100%; height: 420px; border: 0; border-radius: 8px; background: #000; }
  .checks { font-size: 13px; margin: 14px 0 22px; padding: 12px 16px;
            border: 1px solid #ddd; border-radius: 8px; }
  .checks div { margin: 3px 0; }
  .pass { color: #16a34a; } .fail { color: #dc2626; } .wait { color: #999; }
  .summary { display: flex; gap: 8px; margin: 16px 0 6px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .high { background: #fee2e2; color: #991b1b; }
  .medium { background: #fef3c7; color: #92400e; }
  .low { background: #e5e7eb; color: #374151; }
  .card { display: flex; gap: 14px; border: 1px solid #ddd; border-radius: 10px;
          padding: 14px; margin-bottom: 12px; }
  .card:hover { border-color: #2563eb; }
  .card img { width: 150px; height: 90px; object-fit: cover; border-radius: 6px;
              background: #eee; flex-shrink: 0; cursor: pointer; }
  .noimg { width: 150px; height: 90px; border-radius: 6px; background: #f3f4f6;
           display: flex; align-items: center; justify-content: center;
           color: #9ca3af; font-size: 12px; flex-shrink: 0; }
  .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .time { font-weight: 700; font-size: 15px; color: #2563eb; cursor: pointer; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #eef2ff; color: #3730a3; }
  .tag.fact { background: #ecfdf5; color: #065f46; }
  .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .body { font-size: 13.5px; }
  .body .label { color: #888; margin-right: 4px; }
  .ctx { color: #9ca3af; font-size: 12.5px; }
  .reason { color: #555; margin-top: 5px; font-size: 13px; }
  .refs { margin-top: 9px; padding-top: 8px; border-top: 1px dashed #e2e2e2; }
  .refs-title { font-size: 11px; color: #888; margin-bottom: 4px; }
  .refs a { display: block; font-size: 12.5px; color: #2563eb;
            text-decoration: none; margin-bottom: 3px; }
  .refs a:hover { text-decoration: underline; }
  .refs .meta { color: #999; font-size: 11px; }
  .actions { margin-top: 9px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #err { color: #dc2626; font-size: 14px; }
  .warn { border: 1px solid #f59e0b; background: #fffbeb; border-radius: 8px;
          padding: 10px 12px; margin: 12px 0; font-size: 13px; color: #92400e; }
  .warn strong { display: block; margin-bottom: 4px; }
  .warn div { margin-top: 3px; }
  .cov { font-size: 12px; color: #666; margin: 4px 0 14px; }
  .cov span { display: inline-block; margin-right: 12px; }
  .cov .ok { color: #16a34a; }
  .cov .bad { color: #dc2626; }
</style>
</head>
<body>

<h1>공개 전 검수 리스트</h1>
<div class="sub">
  다시 확인할 지점을 시간순으로 보여줍니다. 최종 판단은 제작자가 합니다.
  프론트 구현 참고용으로 써도 됩니다.
</div>

<div class="row">
  <label>최근 영상</label>
  <select id="picker" style="min-width:360px"></select>
  <button id="refresh" class="ghost">목록 새로고침</button>
</div>

<div class="row">
  <label>videoId</label>
  <input type="number" id="videoId" value="1">
  <button id="load">불러오기</button>
  <button id="reload" class="ghost">영상만 다시 로드</button>
  <button id="complete" class="ghost">검수 완료</button>
  <span id="now" style="color:#999;font-size:12px"></span>
</div>

<div id="err"></div>

<div class="checks">
  <strong style="font-size:13px">검증 항목</strong>
  <div id="c-report" class="wait">· 검수 리스트 조회 — 대기</div>
  <div id="c-stream" class="wait">· 영상 재생(/stream) — 대기</div>
  <div id="c-seek"   class="wait">· 구간 이동(HTTP Range) — 대기</div>
  <div id="c-frame"  class="wait">· 캡처 이미지(/frames) — 대기</div>
  <div id="c-ref"    class="wait">· 참고 자료(references) — 대기</div>
  <div id="c-action" class="wait">· 검수 결정 저장(PUT) — 대기</div>
</div>

<!-- 재생기는 두 가지다. sourceType 에 따라 하나만 보여준다.
     업로드  → <video>  서버에 파일이 있다
     유튜브  → YT.Player  서버에 파일이 없다. 삽입 플레이어로만 재생된다
     유튜브 주소를 <video src> 에 넣으면 오류 없이 검은 화면만 나온다. -->
<video id="player" controls preload="metadata"></video>

<!-- YT.Player 가 안쪽 div 를 iframe 으로 바꿔 넣는다.
     그래서 보이기/숨기기는 바깥 wrap 으로 한다. -->
<div id="ytWrap" style="display:none">
  <div id="ytPlayer"></div>
</div>

<div id="warnings"></div>
<div class="summary" id="summary"></div>
<div class="cov" id="coverage"></div>
<div id="events"></div>

<script>
const $ = (id) => document.getElementById(id);
const player = $('player');
const ytWrap = $('ytWrap');
let seekTested = false;
let currentVideoId = null;

/** 지금 유튜브 영상을 보고 있는지. 재생·이동 방법이 달라진다 */
let isYouTube = false;
let ytVideoId = null;
let ytSourceUrl = null;

/** 공식 IFrame API 로 만든 플레이어. 준비되기 전에는 null */
let yt = null;
let ytReady = false;

/** 플레이어가 준비되기 전에 카드를 누른 경우 기억해 뒀다가 준비되면 실행한다 */
let pendingSeekSec = null;

/** 삽입 재생이 막힌 영상인지. 그러면 유튜브에서 열 수밖에 없다 */
let ytEmbedBlocked = false;

/**
 * 유튜브 IFrame API 스크립트를 한 번만 불러온다.
 *
 * postMessage 로 직접 명령을 보내는 방법도 있지만 그건 불안정하다.
 * 플레이어가 준비되기 전에 보내면 조용히 무시되고,
 * 준비됐는지 알 방법이 없어서 "눌러도 아무 일도 안 일어나는" 상태가 된다.
 * 공식 API 는 onReady 를 주기 때문에 그 시점을 알 수 있다.
 */
let ytApiPromise = null;
function loadYouTubeApi() {
  if (ytApiPromise) return ytApiPromise;

  ytApiPromise = new Promise((resolve) => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = () => resolve();
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}

/**
 * 리포트를 보고 맞는 재생기를 띄운다.
 *
 * 유튜브 주소를 <video src> 에 넣으면 오류 없이 검은 화면만 나온다.
 * 그 주소는 영상 파일이 아니라 HTML 페이지라서 video 태그가 재생할 수 없다.
 * 서버가 유튜브에 접속을 못 해서가 아니다. 서버는 관여하지 않는다.
 */
async function mountPlayer(report) {
  isYouTube = report.sourceType === 'YOUTUBE';
  ytVideoId = report.youtubeVideoId ?? null;
  ytSourceUrl = report.sourceUrl ?? null;
  ytReady = false;
  ytEmbedBlocked = false;
  pendingSeekSec = null;

  if (isYouTube && ytVideoId) {
    player.pause();
    player.removeAttribute('src');
    player.load();
    player.style.display = 'none';
    ytWrap.style.display = 'block';

    await loadYouTubeApi();

    // 영상이 바뀌면 이전 플레이어는 버린다.
    // destroy 가 iframe 을 지우므로 자리를 다시 만들어 준다.
    if (yt) { try { yt.destroy(); } catch (_) {} yt = null; }
    ytWrap.innerHTML = '<div id="ytPlayer"></div>';

    yt = new YT.Player('ytPlayer', {
      videoId: ytVideoId,
      playerVars: { rel: 0, playsinline: 1 },
      events: {
        onReady: () => {
          ytReady = true;
          mark('c-stream', true, '유튜브 플레이어 준비 완료 (서버 파일 없음)');
          // 준비 전에 누른 카드가 있으면 지금 처리한다
          if (pendingSeekSec != null) {
            yt.seekTo(pendingSeekSec, true);
            yt.playVideo();
            pendingSeekSec = null;
          }
        },
        onError: (e) => {
          // 101 / 150 = 영상 주인이 삽입 재생을 막아둔 것.
          // 우리가 풀 수 있는 문제가 아니라 유튜브에서 여는 수밖에 없다.
          ytEmbedBlocked = (e.data === 101 || e.data === 150);
          mark('c-stream', false, ytEmbedBlocked
            ? '이 영상은 삽입 재생이 막혀 있습니다. 시각을 누르면 유튜브에서 열립니다'
            : `유튜브 플레이어 오류 (코드 ${e.data})`);
        }
      }
    });
    return;
  }

  ytWrap.style.display = 'none';
  player.style.display = 'block';

  if (report.streamUrl) {
    player.src = report.streamUrl + '?t=' + Date.now();
    player.load();
  }
}

/**
 * 그 시각으로 이동한다.
 *
 * 유튜브는 iframe 안이 다른 도메인이라 currentTime 을 직접 못 건드린다.
 * 공식 API 의 seekTo 를 쓴다.
 */
function seekTo(startMs) {
  const sec = Math.max(0, startMs / 1000);

  if (!isYouTube) {
    player.currentTime = sec;
    player.play();
    return;
  }

  // 삽입이 막힌 영상은 새 탭에서 그 시각으로 연다.
  // 타임코드만 보여주고 이동을 막으면 이 도구의 핵심이 빠진다.
  if (ytEmbedBlocked) {
    window.open(`https://www.youtube.com/watch?v=${ytVideoId}&t=${Math.floor(sec)}`, '_blank');
    return;
  }

  // 아직 준비 중이면 기억해 뒀다가 onReady 에서 처리한다.
  // 여기서 그냥 버리면 사용자에게는 "눌렀는데 아무 일도 안 일어남" 이 된다.
  if (!ytReady || !yt) {
    pendingSeekSec = sec;
    return;
  }
  yt.seekTo(sec, true);
  yt.playVideo();
}

function mark(id, ok, text) {
  const el = $(id);
  el.className = ok ? 'pass' : 'fail';
  el.textContent = '· ' + text;
}

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const CHECK_LABELS = {
  'c-report': '검수 리스트 조회',
  'c-stream': '영상 재생(/stream)',
  'c-seek':   '구간 이동(HTTP Range)',
  'c-frame':  '캡처 이미지(/frames)',
  'c-ref':    '참고 자료(references)',
  'c-action': '검수 결정 저장(PUT)'
};

function resetChecks() {
  Object.entries(CHECK_LABELS).forEach(([id, label]) => {
    const el = $(id);
    el.className = 'wait';
    el.textContent = `· ${label} — 대기`;
  });
}

/**
 * 새 응답 규격: { success, data, error }
 * 실패 문구는 최상위 message 가 아니라 error.message 에 있다.
 */
async function call(url, options) {
  const res = await fetch(url, options);
  const body = await res.json();
  if (!body.success) {
    const err = new Error(body.error?.message ?? '요청 실패');
    err.code = body.error?.code;
    throw err;
  }
  return body.data;
}

function hint(id, e) {
  if (e.code === 'ANALYSIS_NOT_COMPLETED') {
    return `${e.message}  ·  videoId ${id} 은 아직 분석 중입니다. 위 목록에서 확인하세요.`;
  }
  if (e.code === 'VIDEO_NOT_FOUND') {
    return `${e.message}  ·  videoId ${id} 이 없습니다. 위 목록에서 골라주세요.`;
  }
  if (e.code === 'REVIEW_INCOMPLETE') {
    return `${e.message}  ·  모든 카드에서 버튼을 눌러 결정한 뒤 다시 시도하세요.`;
  }
  return e.message;
}

// ---------------- 목록 ----------------

async function loadList(selectLatest) {
  let data;
  try {
    data = await call('/api/v1/videos/history?size=50');
  } catch (e) {
    return;
  }

  const A = { COMPLETED: '분석 완료', PROCESSING: '분석 중', PENDING: '대기',
              FAILED: '실패', CANCELLED: '취소됨' };
  const R = { NOT_STARTED: '검수 전', IN_REVIEW: '검수 중', COMPLETED: '검수 완료' };

  $('picker').innerHTML = data.items.map(v => {
    const when = v.uploadedAt ? v.uploadedAt.replace('T', ' ').slice(5, 16) : '';
    return `<option value="${v.videoId}">
              #${v.videoId} · ${esc(v.filename ?? '').slice(0, 32)}
              · ${A[v.analysisStatus] ?? v.analysisStatus}
              · ${R[v.reviewStatus] ?? v.reviewStatus}
              · 후보 ${v.eventCount} / 수정 ${v.editedCount}
              · ${when}
            </option>`;
  }).join('');

  if (selectLatest && data.items.length) {
    $('picker').value = data.items[0].videoId;
    $('videoId').value = data.items[0].videoId;
  }
}

// ---------------- 경고 · 수행 현황 ----------------

function renderWarnings(list) {
  if (!list || !list.length) { $('warnings').innerHTML = ''; return; }
  $('warnings').innerHTML =
    `<div class="warn">
       <strong>아래 분석은 수행하지 못했습니다. 결과가 전부가 아닙니다.</strong>
       ${list.map(w => `<div>· ${esc(w.message)} <code>${esc(w.code)}</code></div>`).join('')}
     </div>`;
}

/** 명세 §5 — coverage 는 객체다. 못 한 이유는 warnings 가 설명한다. */
function renderCoverage(c) {
  if (!c) { $('coverage').innerHTML = ''; return; }
  const cell = (label, ok) =>
    `<span class="${ok ? 'ok' : 'bad'}">${label} ${ok ? '분석함' : '분석 못함'}</span>`;

  $('coverage').innerHTML = '분석 수행 현황 &nbsp; '
    + cell('발언', c.speechAnalyzed)
    + cell('화면 글자', c.screenTextAnalyzed)
    + cell('화면 자료', c.sceneAnalyzed);
}

// ---------------- 참고 자료 ----------------

function refs(list) {
  if (!list || !list.length) return '';
  const items = list.map(r => {
    const meta = [r.sourceLabel, r.provider, r.publishedAt].filter(Boolean).join(' · ');
    return `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}
              ${meta ? `<span class="meta">${esc(meta)}</span>` : ''}
              ${r.relevantContext ? `<span class="meta">→ ${esc(r.relevantContext)}</span>` : ''}</a>`;
  }).join('');

  return `<div class="refs">
            <div class="refs-title">AI 가 확인한 자료 ${list.length}건 — 직접 열어서 확인하세요</div>
            ${items}
          </div>`;
}

// ---------------- 검수 결정 ----------------

const ACTIONS = [
  ['CONFIRMED', '확인함'], ['EDITED', '수정함'],
  ['HOLD', '보류'], ['NOT_USEFUL', '유용하지 않음']
];

async function decide(eventId, action, box) {
  try {
    await call(`/api/v1/videos/${currentVideoId}/review-actions/${eventId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, note: null })
    });
    box.querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.action === action));
    mark('c-action', true, `검수 결정 저장 성공 — event ${eventId} → ${action}`);
  } catch (e) {
    mark('c-action', false, `검수 결정 저장 실패 — ${e.message}`);
  }
}

// ---------------- 메인 ----------------

async function load() {
  const id = $('videoId').value;
  currentVideoId = id;
  $('err').textContent = '';
  $('events').innerHTML = '';
  $('summary').innerHTML = '';
  $('warnings').innerHTML = '';
  $('coverage').innerHTML = '';
  seekTested = false;
  resetChecks();

  // 재생기는 리포트를 받은 뒤에 띄운다.
  // 업로드인지 유튜브인지 응답을 봐야 알 수 있기 때문이다.
  player.pause();
  $('now').textContent = `videoId ${id}`;

  let report;
  try {
    report = await call(`/api/v1/videos/${id}/report`);
    mark('c-report', true, `조회 성공 — 확인할 지점 ${report.events.length}곳`);
  } catch (e) {
    mark('c-report', false, `리포트 조회 실패 — ${e.message} [${e.code ?? '-'}]`);
    $('err').textContent = hint(id, e);
    return;
  }

  mountPlayer(report);

  renderWarnings(report.warnings);
  renderCoverage(report.coverage);

  const s = report.summary;
  const rs = report.reviewSummary ?? {};
  $('summary').innerHTML =
    `<span class="chip low">전체 ${s.total}</span>` +
    `<span class="chip medium">다시 읽어볼 표현 ${s.speechReview}</span>` +
    `<span class="chip high">사실 확인 ${s.factCheck}</span>` +
    `<span class="chip low">결정 ${rs.decided ?? 0} / 남음 ${rs.remaining ?? 0}</span>` +
    `<span class="chip low">${report.reviewStatus ?? ''}</span>`;

  let frameCount = 0;
  let refCount = 0;

  report.events.forEach((e, i) => {
    if (e.frameUrl) frameCount++;
    if (e.references && e.references.length) refCount += e.references.length;

    const seek = () => seekTo(e.startMs);

    const thumb = e.frameUrl
      ? `<img src="${e.frameUrl}" alt="화면 캡처"
             onload="mark('c-frame', true, '캡처 이미지 표시 성공')"
             onerror="mark('c-frame', false, '캡처 이미지 로드 실패')">`
      : `<div class="noimg">캡처 없음</div>`;

    let detail;
    if (e.type === 'SPEECH') {
      detail = (e.contextBefore ? `<div class="ctx">…${esc(e.contextBefore)}</div>` : '')
             + `<div><span class="label">발언</span>${esc(e.text ?? '')}</div>`
             + (e.contextAfter ? `<div class="ctx">${esc(e.contextAfter)}…</div>` : '');
    } else {
      detail = e.speechText
        ? `<div><span class="label">발언</span>${esc(e.speechText)}</div>
           <div><span class="label">자막</span>${esc(e.captionText ?? '')}</div>`
        : `<div><span class="label">화면</span>${esc(e.captionText ?? '')}</div>`;
    }

    const isFact = e.candidateType === 'FACT_CHECK';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${thumb}
      <div style="flex:1">
        <div class="head">
          <span class="time">${e.endMs - e.startMs > 4000
              ? fmt(e.startMs) + ' ~ ' + fmt(e.endMs) : fmt(e.startMs)}</span>
          <span class="tag ${isFact ? 'fact' : ''}">${isFact ? '사실 확인' : '다시 읽어볼 표현'}</span>
          <span class="tag">${e.type === 'SPEECH' ? '발언' : '화면'}</span>
          ${e.occurrences > 1 ? `<span class="tag">${e.occurrences}회 반복</span>` : ''}
          <span style="color:#999;font-size:12px">#${i + 1} · id ${e.id}</span>
        </div>
        <div class="title">${esc(e.title ?? '')}</div>
        <div class="body">${detail}</div>
        <div class="reason">${esc(e.reason ?? '')}</div>
        ${refs(e.references)}
        <div class="actions"></div>
      </div>`;

    card.querySelector('img, .noimg')?.addEventListener('click', seek);
    card.querySelector('.time').addEventListener('click', () => {
      seek();
      if (!seekTested) {
        seekTested = true;
        setTimeout(() => {
          if (isYouTube) {
            // iframe 안은 다른 도메인이라 현재 재생 위치를 읽을 수 없다.
            // 명령을 보냈다는 것까지만 확인한다.
            mark('c-seek', true, `유튜브 플레이어에 ${fmt(e.startMs)} 이동 명령을 보냈습니다`);
            return;
          }
          const moved = Math.abs(player.currentTime - e.startMs / 1000) < 2;
          mark('c-seek', moved,
            moved ? `구간 이동 성공 — ${fmt(e.startMs)} 로 점프` : '구간 이동 실패');
        }, 700);
      }
    });

    const box = card.querySelector('.actions');
    ACTIONS.forEach(([value, label]) => {
      const b = document.createElement('button');
      b.className = 'mini' + (e.reviewAction === value ? ' on' : '');
      b.textContent = label;
      b.dataset.action = value;
      b.onclick = () => decide(e.id, value, box);
      box.appendChild(b);
    });

    $('events').appendChild(card);
  });

  if (frameCount === 0) {
    mark('c-frame', false, '캡처 이미지 없음 — OCR 결과가 없었을 수 있습니다');
  }
  mark('c-ref', refCount > 0,
       refCount > 0
         ? `참고 자료 ${refCount}건 — 링크를 눌러 원문을 확인하세요`
         : '참고 자료 없음 — 사실 확인에서 잡힌 게 없으면 정상입니다');

  if (report.events.length === 0) {
    $('events').innerHTML = '<p style="color:#888">다시 확인할 지점을 찾지 못했습니다.</p>';
    mark('c-seek', false, '구간 이동 — 확인할 카드가 없습니다');
    mark('c-action', false, '검수 결정 — 결정할 카드가 없습니다');
  }
}

$('picker').addEventListener('change', () => {
  $('videoId').value = $('picker').value;
  load();
});
$('refresh').addEventListener('click', () => loadList(true));
$('load').addEventListener('click', load);
$('reload').addEventListener('click', () => {
  // 유튜브는 처음부터 다시 재생하고, 업로드는 스트림을 다시 받는다
  if (isYouTube) {
    if (ytReady && yt) { yt.seekTo(0, true); yt.playVideo(); }
    return;
  }
  player.src = `/api/v1/videos/${$('videoId').value}/stream?t=` + Date.now();
  player.load();
});
$('complete').addEventListener('click', async () => {
  try {
    const data = await call(`/api/v1/videos/${$('videoId').value}/review-completion`,
                            { method: 'POST' });
    $('err').style.color = '#16a34a';
    $('err').textContent = `검수 완료 — 확인 ${data.summary.confirmed} · `
      + `수정 ${data.summary.edited} · 보류 ${data.summary.hold} · `
      + `유용하지않음 ${data.summary.notUseful}`;
    load();
  } catch (e) {
    $('err').style.color = '#dc2626';
    $('err').textContent = hint($('videoId').value, e);
  }
});

loadList(true);

player.addEventListener('loadedmetadata', () => {
  mark('c-stream', true, `영상 재생 준비 완료 — 길이 ${fmt(player.duration * 1000)}`);
});
player.addEventListener('error', () => {
  // 유튜브를 보는 중이면 video 태그는 원래 안 쓴다. 실패가 아니다.
  if (isYouTube) return;
  mark('c-stream', false, '영상 로드 실패 — 서버에 파일이 없거나 보관 기간이 지났습니다');
});

</script>

</body>
</html>
