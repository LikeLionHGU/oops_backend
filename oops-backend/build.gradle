plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'oops-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'          // local 프로파일용
    runtimeOnly 'com.mysql:mysql-connector-j' // dev/prod 프로파일용

    // API 문서 (Swagger UI). springdoc 3.x 가 Spring Boot 4 를 지원한다.
    // 기동 시 Jackson 관련 오류가 나면 이 줄을 주석 처리하면 된다.
    // 문서만 빠지고 나머지 기능은 그대로 동작한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Explicit opt-in text-only model trial; never part of test/bootRun.
tasks.register('textBoundaryTrial', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.TextBoundaryTrial'
    doFirst {
        def output = providers.gradleProperty('trialOutput').orNull
        def budget = providers.gradleProperty('trialBudget').orNull
        if (!output || !budget || providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Explicit trialLiveApproved=true, trialOutput and trialBudget required')
        args 'src/test/resources/evals/text-boundaries-37.json', '../datasets/controversy/guidelines/runtime.json', output, budget
    }
}

// Explicit paid opt-in: fixed verification requests; never part of test/bootRun.
tasks.register('candidateHypothesisTrial', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.CandidateHypothesisTrial'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        def budget = providers.gradleProperty('trialBudget').orNull
        if (!plan || !output || !budget || providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Explicit trialLiveApproved, trialPlan, trialOutput, trialBudget required')
        args plan, output, budget
    }
}

// Explicit paid opt-in; B/D original candidate groups remain intact.
tasks.register('bdHypothesisTrial', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.BdHypothesisTrial'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        def budget = providers.gradleProperty('trialBudget').orNull
        if (!plan || !output || !budget || providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Explicit trialLiveApproved, trialPlan, trialOutput, trialBudget required')
        args plan, output, budget
    }
}

// Stored-STT preparation plus separately authorized paid comparison; never a server endpoint.
tasks.register('contextPolicyTrial', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextPolicyTrial'
    doFirst {
        def mode = providers.gradleProperty('trialMode').orNull
        def input = providers.gradleProperty('trialInput').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!mode || !input || !output) throw new GradleException('Set trialMode, trialInput, trialOutput; run is paid and needs approval')
        args mode, input, output
    }
}

// Comparison 41: preparation is offline; run requires explicit consent and a frozen-plan hash.
tasks.register('banterPolicyTrial', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.BanterPolicyTrial'
    doFirst {
        def mode = providers.gradleProperty('trialMode').orNull
        def input = providers.gradleProperty('trialInput').orNull
        def control = providers.gradleProperty('trialControl').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!(mode in ['prepare', 'run']) || !input || !control || !output)
            throw new GradleException('Set trialMode, trialInput, trialControl (packet or approved SHA), trialOutput')
        if (mode == 'run' && providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Paid run requires explicit trialLiveApproved=true and user consent')
        args mode, input, control, output
    }
}

// Read-only saved-response replay; never sends an API request or repairs model responses.
tasks.register('auditDecisionContracts', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.OfflineDecisionContractAudit'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def results = providers.gradleProperty('trialResults').orNull
        def report = providers.gradleProperty('auditOutput').orNull
        if (!plan || !results || !report)
            throw new GradleException('Set trialPlan, trialResults and a new private auditOutput')
        args plan, results, report
    }
}

// Comparison 42: output instruction pairs only; no live runner is selected by this task.
tasks.register('prepareVerificationContractComparison', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.VerificationContractComparison'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!plan || !output) throw new GradleException('Set trialPlan and a new private trialOutput file')
        args plan, output
    }
}

// Real routing/discovery/verification on frozen excerpts. Paid only with fresh explicit opt-in.
tasks.register('mechanismRoutingTrial', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.MechanismRoutingTrial'
    doFirst {
        def mode = providers.gradleProperty('trialMode').orNull
        def input = providers.gradleProperty('trialInput').orNull
        def control = providers.gradleProperty('trialControl').orNull
        def extra = providers.gradleProperty('trialExtra').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!mode || !input || !control || !extra || !output)
            throw new GradleException('Set trialMode, trialInput, trialControl, trialExtra, trialOutput')
        if (mode == 'run' && providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Explicit fresh paid/text consent required')
        args mode, input, control, extra, output
    }
}

// Replay saved classifier routes into reference selection only. Never invokes a model.
tasks.register('auditRoutingPriority', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.RoutingPriorityAudit'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def results = providers.gradleProperty('trialResults').orNull
        def output = providers.gradleProperty('auditOutput').orNull
        if (!plan || !results || !output) throw new GradleException('Set trialPlan, trialResults, new private auditOutput')
        args plan, results, output
    }
}

// Fresh exact-plan cost and synthetic-text consent required; max 48 routing-only HTTP attempts.
tasks.register('runRoutingProbes', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextRoutingProbeExecution'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def sha = providers.gradleProperty('approvedPlanSha').orNull
        def consent = providers.gradleProperty('trialConsent').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!plan || !sha || !consent || !output || providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Fresh trialLiveApproved, trialPlan, approvedPlanSha, trialConsent, NEW trialOutput required')
        args plan, sha, consent, output
    }
}

// Prepare frozen logical routing requests only; no HTTP client or credentials.
tasks.register('prepareRoutingProbes', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextRoutingProbePlan'
    doFirst {
        def probes = providers.gradleProperty('probePlan').orNull
        def preview = providers.gradleProperty('previewRuntime').orNull
        def registry = providers.gradleProperty('routingRegistry').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!probes || !preview || !registry || !output) throw new GradleException('Set probePlan, previewRuntime, routingRegistry, new private trialOutput')
        args probes, preview, registry, output
    }
}

// Synthetic retrieval probes; oracle manual keys are controls, never model predictions.
tasks.register('auditRetrievalContrasts', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextRetrievalContrastAudit'
    doFirst {
        def probes = providers.gradleProperty('probePlan').orNull
        def base = providers.gradleProperty('baselineRuntime').orNull
        def preview = providers.gradleProperty('previewRuntime').orNull
        def output = providers.gradleProperty('auditOutput').orNull
        if (!probes || !base || !preview || !output) throw new GradleException('Set probePlan, baselineRuntime, previewRuntime, new private auditOutput')
        args probes, base, preview, output
    }
}

// Local role-search ablation on frozen candidates; no provider or manual hints.
tasks.register('auditContextRelations', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextRelationPreviewAudit'
    doFirst {
        def results = providers.gradleProperty('trialResults').orNull
        def base = providers.gradleProperty('baselineRuntime').orNull
        def preview = providers.gradleProperty('previewRuntime').orNull
        def output = providers.gradleProperty('auditOutput').orNull
        if (!results || !base || !preview || !output) throw new GradleException('Set trialResults, baselineRuntime, previewRuntime, new private auditOutput')
        args results, base, preview, output
    }
}

// Local retrieval only: manual hints are an audit control, not model predictions.
tasks.register('auditContextUnitRetrieval', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextUnitPreviewAudit'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def base = providers.gradleProperty('baselineRuntime').orNull
        def preview = providers.gradleProperty('previewRuntime').orNull
        def output = providers.gradleProperty('auditOutput').orNull
        def db = providers.gradleProperty('sourceDb').orNull
        if (!plan || !base || !preview || !output || !db) throw new GradleException('Set trialPlan, baselineRuntime, previewRuntime, auditOutput, sourceDb')
        args plan, base, preview, output, db
    }
}

// Offline policy pairing only: no paid runner or automatic Spring promotion.
tasks.register('prepareContextJudgmentComparison', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.PrepareContextJudgmentComparison'
    doFirst {
        def trace = providers.gradleProperty('traceInput').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        if (!trace || !output) throw new GradleException('Set traceInput and trialOutput private paths')
        args trace, output
    }
}

// Reference-only ablation: offline preparation and separately authorized paid execution.
tasks.register('prepareReferenceTrial', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ReferenceOnlyTrial'
    doFirst {
        def output = providers.gradleProperty('trialOutput').orNull
        if (!output) throw new GradleException('New private trialOutput required')
        args 'prepare', '../datasets/controversy/legacy/runtime-history/aa8e90044981fe403aa4ddce1c04102794ac54b4d828dc7d93a3e20e8aeaccbc.json',
                '../datasets/controversy/guidelines/runtime.json', '../datasets/controversy/experiments/text-boundary-37-20261014/results.json', output
    }
}
tasks.register('referenceOnlyTrial', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ReferenceOnlyTrial'
    doFirst {
        def plan = providers.gradleProperty('trialPlan').orNull
        def output = providers.gradleProperty('trialOutput').orNull
        def budget = providers.gradleProperty('trialBudget').orNull
        if (!plan || !output || !budget || providers.gradleProperty('trialLiveApproved').orNull != 'true')
            throw new GradleException('Explicit trialLiveApproved, trialPlan, trialOutput, trialBudget required')
        args 'run', plan, output, budget
    }
}

// No server startup or paid API calls: inspect curated-case eligibility/retrieval on saved text.
tasks.register('reviewCaseReplay', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ReviewCaseReplay'
    doFirst {
        def replayInputPath = providers.gradleProperty('replayInput').orNull
        def caseArchivePath = providers.gradleProperty('caseArchive').orNull
        if (!replayInputPath || !caseArchivePath) {
            throw new GradleException('Set -PreplayInput=<input.json> -PcaseArchive=<archive.json>')
        }
        args replayInputPath, caseArchivePath
    }
}

// Saved-response audit with the production evidence validator, without paid calls.
tasks.register('reviewGuidelineReplay', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ReviewGuidelineReplay'
    doFirst {
        def input = providers.gradleProperty('replayInput').orNull
        def report = providers.gradleProperty('replayReport').orNull
        def archive = providers.gradleProperty('guidelineArchive').orNull
        if (!input || !report || !archive) throw new GradleException('Set replayInput, replayReport and guidelineArchive local paths')
        args input, report, archive
    }
}

// Local reference routing/input-size audit; no Spring/media/provider calls.
tasks.register('contextReferenceAudit', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.oops.analyzer.ContextReferenceAudit'
    doFirst {
        def input = providers.gradleProperty('replayInput').orNull
        def archive = providers.gradleProperty('guidelineArchive').orNull
        if (!input || !archive) throw new GradleException('Set replayInput and guidelineArchive local paths')
        args input, archive
    }
}
