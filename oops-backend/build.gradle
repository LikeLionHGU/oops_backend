plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'oops-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Experiments can use runtime code, never the reverse. JUnit can test both.
sourceSets {
    experiment {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources.srcDir 'src/test/resources'
    }
    test {
        compileClasspath += sourceSets.experiment.output
        runtimeClasspath += sourceSets.experiment.output
    }
}

configurations {
    experimentImplementation.extendsFrom implementation
    experimentRuntimeOnly.extendsFrom runtimeOnly
    testImplementation.extendsFrom experimentImplementation
    testRuntimeOnly.extendsFrom experimentRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'          // local 프로파일용
    runtimeOnly 'com.mysql:mysql-connector-j' // dev/prod 프로파일용

    // API 문서 (Swagger UI). springdoc 3.x 가 Spring Boot 4 를 지원한다.
    // 기동 시 Jackson 관련 오류가 나면 이 줄을 주석 처리하면 된다.
    // 문서만 빠지고 나머지 기능은 그대로 동작한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // 실험용 맥락 토큰 예산 계산(ContextTokenBudget). 운영 분석 경로는 사용하지 않는다.
    experimentImplementation 'com.knuddels:jtokkit:1.1.0'

    // Mock HTTP/request capture is used by offline experiment preparation too.
    experimentImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'dataset-backed'
    }
}

// Private ignored datasets remain local; opt into their audits separately when available.
tasks.register('datasetTest', Test) {
    group = 'verification'
    description = 'Runs tests tagged dataset-backed; requires the private ../datasets/controversy tree.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'dataset-backed'
    }
    doFirst {
        if (!file('../datasets/controversy').isDirectory()) {
            throw new GradleException('datasetTest requires the private ../datasets/controversy directory')
        }
    }
}

// Inspect the actual deployable archive, including nested class files and dependencies.
tasks.register('verifyRuntimeSeparation') {
    group = 'verification'
    description = 'Fails when experiment/test classes or experiment-only libraries enter bootJar.'
    dependsOn tasks.named('bootJar'), tasks.named('experimentClasses'), tasks.named('testClasses')
    doLast {
        def forbiddenClasses = new HashSet<String>()
        [sourceSets.experiment.output.classesDirs, sourceSets.test.output.classesDirs].each { roots ->
            roots.files.each { root ->
                fileTree(root).matching { include '**/*.class' }.files.each { cls ->
                    forbiddenClasses.add('BOOT-INF/classes/' + root.toPath().relativize(cls.toPath()).toString().replace('\\', '/'))
                }
            }
        }
        def archive = tasks.named('bootJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def leaks = zip.entries().findAll { entry ->
                forbiddenClasses.contains(entry.name) ||
                    (entry.name.startsWith('BOOT-INF/lib/') &&
                        entry.name ==~ /.*\/(jtokkit|junit.*|mockito.*|assertj.*|spring-test|spring-boot-test.*)-[^\/]+\.jar/)
            }.collect { it.name }
            if (!leaks.isEmpty()) throw new GradleException('Non-runtime content in bootJar: ' + leaks)
        }
        logger.lifecycle('Runtime separation verified: no experiment/test classes or test-only libraries in bootJar')
    }
}

tasks.named('check') { dependsOn tasks.named('verifyRuntimeSeparation') }

apply from: 'gradle/experiments.gradle'
