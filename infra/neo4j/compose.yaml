name: oops-neo4j-aws

services:
  neo4j:
    image: neo4j:2026.10.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${OOPS_DB_PASSWORD:?Run sudo bash start-server.sh first}"
      OOPS_DB_PASSWORD: "${OOPS_DB_PASSWORD:?Run sudo bash start-server.sh first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    mem_limit: 1536m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$OOPS_DB_PASSWORD\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  importer:
    build:
      context: .
      dockerfile: Dockerfile.importer
    profiles: ["tools"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${OOPS_DB_PASSWORD:?Run sudo bash start-server.sh first}"
      NEO4J_DATABASE: neo4j
    mem_limit: 384m
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  neo4j_data:
  neo4j_logs:
