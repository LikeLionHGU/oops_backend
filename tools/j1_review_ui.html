<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>J1 사람 검토</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --line:#e3e3df; --ink:#1d1d1b; --mute:#77776f; --accent:#2f5bd3;
          --pass:#2e7d4f; --risk:#c2410c; --unc:#8a6d00; --ctx:#dbe6ff; --ev:#ffe1d1; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header .tabs button { margin-right:4px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea { font:inherit; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  #status { color:var(--mute); margin-left:auto; }
  #status.err { color:var(--risk); }
  main { display:grid; grid-template-columns:230px 1fr; height:calc(100vh - 54px); }
  nav { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  nav div { padding:6px 12px; cursor:pointer; display:flex; justify-content:space-between; border-bottom:1px solid #f0f0ec; }
  nav div.cur { background:#eef2ff; font-weight:600; }
  nav .d-PASS { color:var(--pass); } nav .d-REVIEW_REQUIRED { color:var(--risk); } nav .d-UNCERTAIN { color:var(--unc); }
  section { overflow:auto; padding:16px 20px 40px; }
  .decide { display:flex; gap:8px; align-items:center; margin:8px 0 12px; flex-wrap:wrap; }
  .decide button { padding:8px 14px; font-weight:600; }
  .decide button.on.PASS { background:var(--pass); border-color:var(--pass); }
  .decide button.on.REVIEW_REQUIRED { background:var(--risk); border-color:var(--risk); }
  .decide button.on.UNCERTAIN { background:var(--unc); border-color:var(--unc); }
  .hint { color:var(--mute); font-size:12px; }
  table { border-collapse:collapse; width:100%; background:var(--panel); border:1px solid var(--line); }
  td { padding:4px 8px; border-bottom:1px solid #f0f0ec; vertical-align:top; }
  td.t { color:var(--mute); white-space:nowrap; width:1%; font-variant-numeric:tabular-nums; }
  td.b { white-space:nowrap; width:1%; }
  td.b button { padding:2px 7px; font-size:12px; }
  tr.target td { background:#fff6c7; font-weight:600; }
  tr.ctx td.x { background:var(--ctx); } tr.ev td.x { background:var(--ev); }
  button.c.on { background:#3b6fe0; border-color:#3b6fe0; } button.e.on { background:#d9622b; border-color:#d9622b; }
  .row2 { display:flex; gap:12px; margin-top:12px; align-items:flex-start; flex-wrap:wrap; }
  .row2 textarea { width:420px; height:60px; }
  .extra input { width:260px; }
</style>
</head>
<body>
<header>
  <span class="tabs" id="tabs"></span>
  <label>검토자 ID <input id="reviewer" size="12"></label>
  <button id="finalize">이 영상 확정</button>
  <span id="status">불러오는 중…</span>
</header>
<main>
  <nav id="list"></nav>
  <section id="view"></section>
</main>
<script>
const DECISIONS = [["PASS", "PASS · 검토 불필요"], ["REVIEW_REQUIRED", "REVIEW_REQUIRED · 검토 필요"], ["UNCERTAIN", "UNCERTAIN · 판단 불가"]];
let videos = [], video = null, state = null, cur = 0, timer = null, shown = null;
const $ = id => document.getElementById(id);
const clock = ms => `${String(Math.floor(ms / 60000)).padStart(2, "0")}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => n.append(k)); return n; };

function setStatus(text, err = false) { $("status").textContent = text; $("status").className = err ? "err" : ""; }

async function loadVideos() {
  videos = await (await fetch("/api/videos")).json();
  const tabs = $("tabs"); tabs.replaceChildren();
  videos.forEach(v => tabs.append(el("button", {
    className: v.videoId === video ? "on" : "", textContent: `${v.videoId} (${v.decided}/${v.total})${v.finalized ? " ✓" : ""}`,
    onclick: () => openVideo(v.videoId)
  })));
}

async function openVideo(id) {
  await flush();
  video = id; cur = 0;
  state = await (await fetch(`/api/state?video=${id}`)).json();
  $("reviewer").value = state.reviewerId || "";
  const first = state.cases.findIndex(c => !c.humanDecision);
  cur = first < 0 ? 0 : first;
  await loadVideos(); render();
  setStatus(state.finalized ? "확정됨 (읽기 전용)" : "자동 저장됨");
}

function change(rerender = true) {
  if (state.finalized) return;
  clearTimeout(timer); setStatus("저장 대기…");
  timer = setTimeout(save, 400);
  if (rerender) render();
}

async function save() {
  timer = null;
  state.reviewerId = $("reviewer").value;
  const r = await fetch(`/api/save?video=${video}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
  const body = await r.json();
  if (body.ok) { setStatus(`자동 저장됨 · ${body.progress.decided}/${body.progress.total}`); loadVideos(); }
  else setStatus(`저장 실패: ${body.error}`, true);
}

async function flush() { if (timer) { clearTimeout(timer); await save(); } }

function toggle(list, id) { const i = list.indexOf(id); i < 0 ? list.push(id) : list.splice(i, 1); }

function render() {
  const list = $("list"); list.replaceChildren();
  state.cases.forEach((c, i) => list.append(el("div", { className: i === cur ? "cur" : "", onclick: () => { cur = i; render(); } },
    el("span", { textContent: `${i + 1}. ${c.targetSegmentId}` }),
    el("span", { className: `d-${c.humanDecision}`, textContent: c.humanDecision ? c.humanDecision.replace("REVIEW_REQUIRED", "REVIEW") : "·" }))));
  const c = state.cases[cur], ro = state.finalized, view = $("view");
  view.replaceChildren(
    el("h3", { textContent: `${cur + 1}/${state.cases.length} · ${c.targetSegmentId} (${clock(c.startMs)})` }),
    el("div", { className: "decide" }, ...DECISIONS.map(([d, label], k) => el("button", {
      className: `${d}${c.humanDecision === d ? " on" : ""}`, textContent: `${k + 1} ${label}`, disabled: ro,
      onclick: () => { c.humanDecision = d; change(); }
    })), el("span", { className: "hint", textContent: "단축키 1·2·3 판정, ←/→ 이전·다음" })),
    el("p", { className: "hint", textContent: "맥락 = 판정에 꼭 필요한 구간, 근거 = 위험 근거 구간. 줄의 버튼을 눌러 켜고 끈다." }),
    table(c, ro),
    el("div", { className: "row2" },
      el("label", {}, "메모", el("br"), el("textarea", { value: c.note || "", disabled: ro, oninput: e => { c.note = e.target.value; change(false); } })),
      el("label", { className: "extra" }, "창 밖 맥락 구간 ID (쉼표로 구분)", el("br"), el("input", {
        value: c.contextSegmentIds.filter(id => !c.window.some(s => s.id === id)).join(", "), disabled: ro,
        onchange: e => {
          const inWindow = c.contextSegmentIds.filter(id => c.window.some(s => s.id === id));
          const extra = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
          c.contextSegmentIds = [...inWindow, ...extra]; change();
        }
      }))),
    el("div", { className: "row2" },
      el("button", { textContent: "← 이전", disabled: cur === 0, onclick: () => { cur--; render(); } }),
      el("button", { textContent: "다음 →", disabled: cur === state.cases.length - 1, onclick: () => { cur++; render(); } }),
      el("button", { textContent: "다음 미결정", onclick: () => { const n = state.cases.findIndex((x, i) => i > cur && !x.humanDecision); if (n >= 0) { cur = n; render(); } } }))
  );
  $("finalize").disabled = ro;
  const key = `${video}:${cur}`;
  if (shown !== key) { shown = key; const target = view.querySelector("tr.target"); if (target) target.scrollIntoView({ block: "center" }); }
}

function table(c, ro) {
  const t = el("table");
  c.window.forEach(s => {
    const isTarget = s.id === c.targetSegmentId, ctx = c.contextSegmentIds.includes(s.id), ev = c.evidenceSegmentIds.includes(s.id);
    const row = el("tr", { className: [isTarget ? "target" : "", ctx ? "ctx" : "", ev ? "ev" : ""].join(" ") },
      el("td", { className: "b" },
        el("button", { className: `c${ctx ? " on" : ""}`, textContent: "맥락", disabled: ro || isTarget, onclick: () => { toggle(c.contextSegmentIds, s.id); change(); } }), " ",
        el("button", { className: `e${ev ? " on" : ""}`, textContent: "근거", disabled: ro, onclick: () => { toggle(c.evidenceSegmentIds, s.id); change(); } })),
      el("td", { className: "t", textContent: clock(s.startMs) }),
      el("td", { className: "x", textContent: s.text }));
    t.append(row);
  });
  return t;
}

document.addEventListener("keydown", e => {
  if (!state || ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
  const c = state.cases[cur];
  if (["1", "2", "3"].includes(e.key) && !state.finalized) { c.humanDecision = DECISIONS[+e.key - 1][0]; change(); }
  else if (e.key === "ArrowRight" && cur < state.cases.length - 1) { cur++; render(); }
  else if (e.key === "ArrowLeft" && cur > 0) { cur--; render(); }
});
$("reviewer").addEventListener("input", () => change(false));
$("finalize").onclick = async () => {
  await flush();
  if (!confirm(`영상 ${video}의 사람 라벨을 확정합니다. 확정 후에는 고칠 수 없습니다. 계속할까요?`)) return;
  state.reviewerId = $("reviewer").value;
  const r = await fetch(`/api/finalize?video=${video}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
  const body = await r.json();
  if (body.ok) openVideo(video); else setStatus(`확정 실패: ${body.error}`, true);
};
loadVideos().then(() => openVideo(videos[0].videoId));
</script>
</body>
</html>
