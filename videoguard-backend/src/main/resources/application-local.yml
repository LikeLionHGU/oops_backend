# 로컬: DB 설치 없이 실행 (H2 파일 모드)
#
# 인메모리(jdbc:h2:mem)가 아니라 파일에 저장한다.
# 인메모리로 두면 서버를 재시작할 때마다 영상 목록이 통째로 사라져서,
# 프론트가 videoId 1번으로 개발하다가 갑자기 404 를 만나게 된다.
# 업로드한 파일(uploads/)은 남는데 DB 만 비면 서로 어긋나기도 한다.
spring:
  datasource:
    # AUTO_SERVER 와 DB_CLOSE_ON_EXIT 는 H2 2.4 에서 같이 쓸 수 없다.
    # 여러 프로세스가 같은 파일을 열 일이 없으므로 AUTO_SERVER 는 뺀다.
    url: jdbc:h2:file:./data/videoguard;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update          # 스키마를 유지한 채 변경분만 반영
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console

logging:
  level:
    com.example.videoguard: DEBUG
