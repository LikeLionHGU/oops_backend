function visibleNode(a){if(view.id!=='cases'||!a.id.startsWith('case:'))return true;return (!mechanismFilter||(a.mechanisms||[]).includes(mechanismFilter))&&(!originFilter||(originFilter==='runtime'&&a.origins?.includes('실행 참고'))||(originFilter==='research'&&!a.origins?.includes('실행 참고'))||(originFilter==='incident'&&a.origins?.includes('사건 원장')))&&(!reviewFilter||(reviewFilter==='UNRECORDED'?!a.decision:a.decision===reviewFilter))}
if(snapshot){const date=new Date(snapshot.createdAt);document.getElementById('snapshot-date').textContent='스냅샷 · '+(Number.isNaN(date.valueOf())?'시각 미상':date.toLocaleString('ko-KR'));document.getElementById('snapshot-note').textContent='고정 스냅샷 · 연구 초안·아카이브 전체는 포함하지 않음. 갱신: python3 tools/export_casebook_map.py';for(const id of ['mechanism-filter','mobile-mechanism-filter'])document.getElementById(id).innerHTML+='<option value="">────────</option>'+snapshot.runtime.guidelines.map(g=>`<option value="${esc(g.id)}">${esc(labels[g.id]||g.id)}</option>`).join('');}
function nav(){for(const id of ['desktop-nav','mobile-nav']){document.getElementById(id).innerHTML=views.map((v,i)=>`<button class="view-btn ${v.id===view.id?'active':''}" data-view="${v.id}" aria-pressed="${v.id===view.id}"><span class="num">0${i+1}</span><span><strong>${v.name}</strong><span class="hint">${v.hint}</span></span></button>`).join('');}}
function transform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.getElementById('zoom-level').textContent=Math.round(scale*100)+'%'}
function fit(){const w=canvas.clientWidth,h=canvas.clientHeight,ww=view.width||1400,hh=view.height||760;scale=Math.max(.08,Math.min(1.05,(w-50)/ww,(h-155)/hh));tx=(w-ww*scale)/2;ty=Math.max(100,(h-hh*scale)/2+30);transform()}
function focusStart(){scale=canvas.clientWidth<760?.78:.85;tx=20-35*scale;ty=125-125*scale;transform()}
function zoomAt(factor,cx,cy){const next=Math.max(.08,Math.min(2,scale*factor));tx=cx-(cx-tx)*next/scale;ty=cy-(cy-ty)*next/scale;scale=next;transform()}
function draw(){
 nav();world.style.width=(view.width||1400)+'px';world.style.height=(view.height||760)+'px';
 document.getElementById('view-kicker').textContent=view.kicker;document.getElementById('view-title').textContent=view.title;document.getElementById('view-description').textContent=view.desc;
 const caseNodes=view.nodes.filter(a=>a.id.startsWith('case:'));document.getElementById('filter-count').textContent=view.id==='cases'?`표시 강조 ${caseNodes.filter(visibleNode).length} / ${caseNodes.length} 사례`:'';
 groups.innerHTML=view.groups.map(g=>`<div class="group" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px"><span class="group-label">${g.label}</span></div>`).join('');
 nodesEl.innerHTML=view.nodes.map(a=>`<button class="node ${a.kind||''} ${a.id===selected?'selected':''} ${visibleNode(a)?'':'filtered'}" data-id="${esc(a.id)}" style="left:${a.x}px;top:${a.y}px" aria-label="${esc(a.title)} 상세 보기" ${visibleNode(a)?'':'tabindex="-1" aria-disabled="true"'}><span class="tag">${esc(a.tag)}</span><strong>${esc(a.title)}</strong><span class="sub">${esc(a.sub)}</span></button>`).join('');
 wires.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#83978a"/></marker></defs>'+view.edges.filter(([a,b,kind])=>!['family','sourceGroup','routingKey'].includes(kind)||selected===a||selected===b).map(([a,b,kind])=>{const s=view.nodes.find(x=>x.id===a),t=view.nodes.find(x=>x.id===b);let x1=s.x+210,y1=s.y+60,x2=t.x,y2=t.y+60;if(Math.abs(s.x-t.x)<140){x1=s.x+105;y1=s.y+120;x2=t.x+105;y2=t.y}const mid=(x1+x2)/2;return `<path class="wire ${kind||''} ${['family','secondary','sourceGroup','routingKey'].includes(kind)?'dashed':''} ${visibleNode(s)&&visibleNode(t)?'':'muted'}" marker-end="url(#arrow)" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}"/>`}).join('');
}
function details(a){selected=a.id;draw();const files=a.files.map(f=>`<li><a href="${esc(f)}">${esc(f.replace('../../',''))}</a></li>`).join('');const linked=view.edges.filter(([x,y])=>x===a.id||y===a.id).map(([x,y,k])=>({id:x===a.id?y:x,type:k||'mechanism'}));const names={family:'사건 연결',secondary:'추가 분류',sourceGroup:'동일 출처 그룹',routingKey:'공유 검색 키',mechanism:'메커니즘'};const linkButtons=linked.map(l=>{const b=view.nodes.find(v=>v.id===l.id);return b?`<li><button class="tool" style="height:auto;text-align:left;margin:3px 0" data-jump="${esc(b.id)}">${esc(b.title)} · ${names[l.type]||'연결'}</button></li>`:''}).join('');const sections=a.sections||[{title:view.id==='cases'?'저장된 맥락 · 판단 경계':'이 단계의 규칙',values:a.rules}];const blocks=sections.map(section=>`<div class="detail-block"><h3>${esc(section.title)}</h3>${section.values.length?`<ul>${section.values.map(v=>`<li>${esc(typeof v==='string'?v:(v.text||JSON.stringify(v)))}</li>`).join('')}</ul>`:`<p class="empty">${esc(section.empty||'기록 없음')}</p>`}</div>`).join('');document.getElementById('detail-content').innerHTML=`<h2>${esc(a.title)}</h2><span class="pill">${esc(a.tag)}</span><p class="lead" style="margin-top:14px">${esc(a.lead)}</p>${blocks}${linkButtons?`<div class="detail-block"><h3>명시적으로 연결된 항목 ${linked.length}</h3><p>동일 출처·검색 키 공유는 동일한 주장이나 판단을 뜻하지 않습니다.</p><ul>${linkButtons}</ul></div>`:''}<div class="status">${esc(a.status)}</div><div class="detail-block"><h3>관련 파일</h3><ul>${files}</ul></div>`;document.getElementById('detail').classList.add('open')}
function switchView(id){view=views.find(v=>v.id===id);selected=null;document.getElementById('detail').classList.remove('open');document.getElementById('detail-content').innerHTML='<h2>항목을 선택해 주세요</h2><p class="lead">관계도에서 노드를 누르면 설명과 규칙, 관련 파일이 여기에 표시됩니다.</p><div class="detail-block"><h3>읽는 방법</h3><p>'+(!snapshot?'로컬 사례 스냅샷이 없습니다. 저장소에서 python3 tools/export_casebook_map.py를 실행한 뒤 새로고침하세요.':view.id==='cases'?'사례와 메커니즘은 실선으로 표시합니다. 추가 메커니즘은 점선, 사건 원장 연결은 관련 항목을 선택하면 표시합니다. 동일 ID만 합쳤고 근거 없는 유사성 연결은 만들지 않았습니다.':'실선은 자료·작업 흐름, 점선은 별도 검수 또는 미완성 경로를 나타냅니다.')+'</p></div>';draw();requestAnimationFrame(focusStart)}
function jump(id){if(view.id!=='cases')switchView('cases');const a=view.nodes.find(x=>x.id===id);if(!a)return;if(!visibleNode(a)){mechanismFilter='';originFilter='';reviewFilter='';for(const id of ['mechanism-filter','mobile-mechanism-filter','origin-filter','mobile-origin-filter','review-filter'])document.getElementById(id).value='';}scale=.9;tx=canvas.clientWidth/2-(a.x+105)*scale;ty=canvas.clientHeight/2-(a.y+60)*scale;transform();details(a)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)switchView(b.dataset.view);const j=e.target.closest('[data-jump]');if(j)jump(j.dataset.jump);const q=e.target.closest('[data-id]');if(q&&!moved)details(view.nodes.find(x=>x.id===q.dataset.id));});
function search(e,outId){const term=e.target.value.trim().toLowerCase(),out=document.getElementById(outId);if(!term){out.innerHTML='';return}const cases=views.find(v=>v.id==='cases');if(!cases){out.textContent='로컬 데이터 스냅샷이 없습니다.';return}const matches=cases.nodes.filter(a=>a.id.startsWith('case:')&&[a.id,a.title,a.lead,...a.rules].join(' ').toLowerCase().includes(term));out.innerHTML=`<div>${matches.length}개 결과</div>`+matches.map(a=>`<button class="view-btn" data-jump="${esc(a.id)}"><span><strong>${esc(a.title)}</strong><span class="hint">${esc(a.sub)}</span></span></button>`).join('')}
document.getElementById('case-search').addEventListener('input',e=>search(e,'search-results'));
document.getElementById('mobile-case-search').addEventListener('input',e=>search(e,'mobile-search-results'));
document.getElementById('mobile-search-results').addEventListener('click',()=>{document.getElementById('mobile-search-results').innerHTML='';document.getElementById('mobile-case-search').value=''});
for(const id of ['mechanism-filter','mobile-mechanism-filter'])document.getElementById(id).addEventListener('change',e=>{mechanismFilter=e.target.value;document.getElementById('mechanism-filter').value=mechanismFilter;document.getElementById('mobile-mechanism-filter').value=mechanismFilter;if(view.id!=='cases')switchView('cases');else draw()});
for(const id of ['origin-filter','mobile-origin-filter'])document.getElementById(id).addEventListener('change',e=>{originFilter=e.target.value;document.getElementById('origin-filter').value=originFilter;document.getElementById('mobile-origin-filter').value=originFilter;if(view.id!=='cases')switchView('cases');else draw()});
document.getElementById('review-filter').addEventListener('change',e=>{reviewFilter=e.target.value;if(view.id!=='cases')switchView('cases');else draw()});
document.getElementById('detail-close').onclick=()=>document.getElementById('detail').classList.remove('open');
document.getElementById('zoom-in').onclick=()=>zoomAt(1.2,canvas.clientWidth/2,canvas.clientHeight/2);document.getElementById('zoom-out').onclick=()=>zoomAt(1/1.2,canvas.clientWidth/2,canvas.clientHeight/2);document.getElementById('fit').onclick=fit;
canvas.addEventListener('keydown',e=>{if(e.target!==canvas)return;const steps={ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]};if(steps[e.key]){e.preventDefault();tx+=steps[e.key][0];ty+=steps[e.key][1];transform()}else if(e.key==='+'||e.key==='='){e.preventDefault();zoomAt(1.2,canvas.clientWidth/2,canvas.clientHeight/2)}else if(e.key==='-'){e.preventDefault();zoomAt(1/1.2,canvas.clientWidth/2,canvas.clientHeight/2)}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0013),e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);moved=false;canvas.classList.add('dragging');if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,tx,ty};if(pointers.size===2){const p=[...pointers.values()];gesture={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&gesture&&'tx'in gesture){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx=gesture.tx+dx;ty=gesture.ty+dy;transform()}else if(pointers.size===2&&gesture&&gesture.distance){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),r=canvas.getBoundingClientRect();zoomAt(d/gesture.distance,(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top);gesture.distance=d;moved=true}});
function end(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];gesture={x:p.x,y:p.y,tx,ty}}else if(!pointers.size){gesture=null;canvas.classList.remove('dragging');setTimeout(()=>{moved=false},0)}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
window.addEventListener('resize',fit);switchView(snapshot?'cases':'map');
</script>
</body>
</html>
